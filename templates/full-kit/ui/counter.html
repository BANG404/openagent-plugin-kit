<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  body { font: 14px system-ui; margin: 16px; color: #222; }
  body.dark { color: #eee; }
  button { font: inherit; padding: 8px 16px; border-radius: 10px; border: 1px solid #888; color: inherit; background: transparent; }
</style>
<button id="increment">Increment</button>
<p id="status"></p>
<script>
  let context;
  let count = 0;
  let request = 0;
  let pending = null;
  const button = document.querySelector('#increment');
  const status = document.querySelector('#status');
  function render() {
    const chinese = context?.locale === 'zh';
    button.textContent = chinese ? '加一' : 'Increment';
    status.textContent = `${chinese ? '计数' : 'Count'}: ${count}`;
    document.body.classList.toggle('dark', context?.theme === 'dark');
  }
  window.addEventListener('message', event => {
    if (event.source !== parent || event.data?.version !== 1) return;
    const data = event.data;
    if (data.type === 'openagent:conversation-ui-context') {
      context = data;
      if (pending === null) count = Number.isSafeInteger(data.props.count) ? data.props.count : 0;
      render();
    }
    if (data.type === 'openagent:conversation-ui-state-result' &&
        data.message_id === context?.message_id && data.request_id === pending) {
      pending = null;
      status.textContent += data.ok ? ' ✓' : ' — Save failed / 保存失败';
    }
  });
  button.addEventListener('click', () => {
    if (!context || pending !== null) return;
    count++;
    pending = String(++request);
    render();
    parent.postMessage({type:'openagent:conversation-ui-state',version:1,
      message_id:context.message_id,request_id:pending,props:{count}}, '*');
  });
</script>
</html>
